name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pyswf:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py_swf_editor
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run tests
      run: |
        python -m pytest tests -q

  flashdec-py:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install PySWF dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r py_swf_editor/requirements.txt pytest
    - name: Run flashdec-py tests
      working-directory: flashdec_py
      run: python -m pytest tests -q

  pyswf-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py_swf_editor/web
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install and typecheck
      run: |
        npm ci
        npm run lint
        npm run build

  suite-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RUST SWF/web
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install and typecheck
      run: |
        npm ci
        npm run lint
        npm run build
