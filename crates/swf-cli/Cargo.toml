[package]
name = "swf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rustswf"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
swf-core.workspace = true
swf-avm.workspace = true
swf-decompile.workspace = true
sha2.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

