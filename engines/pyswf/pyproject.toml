[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py_swf_editor"
version = "0.3.0"
description = "Python SWF editor and decompiler with ABC and AVM support."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "Pillow>=10.0",
]
authors = [
    { name = "Python SWF Editor", email = "noreply@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent"
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
ui-test = ["playwright>=1.50,<2"]
build = ["pyinstaller>=6.0"]
benchmark = ["psutil>=7,<8"]
reference-tools = ["py7zr>=1,<2"]

[project.scripts]
py-swf-web = "server.__main__:main"
pyswf = "py_swf.cli:main"
flash-suite = "py_swf.suite_cli:main"

[tool.setuptools.package-data]
py_swf = ["benchmark_dashboard.html", "benchmark_overview.html"]

[tool.setuptools.packages.find]
include = ["py_swf*", "server*"]
exclude = ["tests*", "third_party*", "packaging*", "tools*"]
